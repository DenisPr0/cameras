name: Update cameras

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Publică chiar dacă numărul de camere a scăzut mult'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-cameras
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5

      - name: Construieste baza de camere
        env:
          PREV_META_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/meta.json
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          node --version
          node scripts/build.mjs out

      - name: Publica pe ramura data (pastrand fisierele existente, ex. cantare)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # luam ramura data existenta (cu cantarele) si adaugam doar fisierele de camere
          git clone -q --depth 1 -b data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch || {
            echo "ramura data nu exista inca — o creez de la zero"; mkdir -p data-branch; cd data-branch; git init -q -b data; cd ..;
          }
          cp out/* data-branch/
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Cameras $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nimic de comis"; exit 0; }
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
