name: Update cameras

on:
  schedule:
    - cron: '23 7 * * *'        # zilnic, 07:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: 'Publică chiar dacă numărul de camere a scăzut mult'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-cameras
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Construiește baza de camere
        env:
          PREV_META_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/meta.json
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          node --version
          node scripts/build.mjs out

      - name: Publică pe ramura data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Camere $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
