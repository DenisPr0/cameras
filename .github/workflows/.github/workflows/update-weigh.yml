name: Update weigh stations

on:
  schedule:
    - cron: '41 4 * * 1'       # săptămânal, luni 04:41 UTC (locațiile se schimbă rar)
  workflow_dispatch:
    inputs:
      force:
        description: 'Publică chiar dacă numărul a scăzut mult'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-weigh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Construieste baza de weigh stations
        env:
          PREV_META_URL: https://raw.githubusercontent.com/${{ github.repository }}/data/weigh-meta.json
          FORCE: ${{ inputs.force && '1' || '0' }}
        run: |
          node --version
          node scripts/build-weigh.mjs out

      - name: Publica pe ramura data (pastrand fisierele existente, ex. camere)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone -q --depth 1 -b data "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-branch || {
            echo "ramura data nu exista inca — o creez de la zero"; mkdir -p data-branch; cd data-branch; git init -q -b data; cd ..;
          }
          cp out/weigh-stations.tsv.gz out/weigh-meta.json data-branch/
          cd data-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weigh-stations.tsv.gz weigh-meta.json
          git commit -q -m "Weigh stations $(date -u +%Y-%m-%dT%H:%MZ)" || { echo "nimic de comis"; exit 0; }
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
